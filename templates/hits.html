{% extends "layout.html" %}
{% block content %}
<div class="card">
    <div class="card-header">💰 Hits (Balance Found)</div>
    <div class="card-body">
        {% if hits %}
        <table class="table table-dark table-striped">
            <thead><tr><th>#</th><th>Details</th></tr></thead>
            <tbody>
                {% for hit in hits %}
                <tr><td>{{ loop.index }}</td><td style="font-family:monospace">{{ hit.strip() }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted text-center">No hits recorded yet.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
